name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker-compose*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 1: Lint & SAST
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: 'Gate 1: Lint & SAST'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: ESLint (with security plugin)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Prettier format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 2: Unit Tests (≥80% coverage)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 'Gate 2: Unit Tests'
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npx jest --project unit --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      - name: Enforce coverage threshold (≥80%)
        run: |
          COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 3: Integration Tests (real DB + Redis)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: 'Gate 3: Integration Tests'
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: enquiry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/enquiry_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npx jest --project integration --runInBand --forceExit

      - name: Run regression tests
        run: npx jest --project regression --runInBand --forceExit

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 4: Docker Build + Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-scan:
    name: 'Gate 4: Docker Build + Security Scan'
    runs-on: ubuntu-latest
    needs: integration-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 5: Deploy + Smoke Tests (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 'Gate 5: Deploy + Smoke Tests'
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /opt/property-platform
            # Save current image for rollback
            docker compose ps --format json | jq -r '.[0].Image' > .previous-image
            # Pull new image
            docker compose pull app
            # Run database migrations
            docker compose exec -T app npx prisma migrate deploy
            # Rolling restart (zero-downtime)
            docker compose up -d --no-deps app
            # Wait for health check
            sleep 10
            curl -sf http://localhost:3000/health/ready || exit 1

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          # Run the 10-point smoke test suite against the live deployment
          npx jest --project smoke --runInBand --forceExit
        working-directory: backend

      - name: Auto-rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /opt/property-platform
            echo "Smoke tests failed — rolling back..."
            PREVIOUS_IMAGE=$(cat .previous-image)
            docker compose up -d --no-deps app
            echo "Rollback complete to previous deployment"

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 6: k6 Load Test (informational, non-blocking)
  # ─────────────────────────────────────────────────────────────────────────────
  load-test:
    name: 'Gate 6: k6 Load Test'
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Run k6 smoke test
        env:
          K6_BASE_URL: ${{ secrets.PRODUCTION_URL }}
        run: k6 run backend/test/k6/scenarios/smoke.js --out json=k6-results.json
        continue-on-error: true

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-results
          path: k6-results.json

      - name: Post load test summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('k6-results.json')) {
              const message = '## k6 Load Test Results\n\nLoad test completed. See artifacts for detailed results.';
              github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: message
              });
            }
