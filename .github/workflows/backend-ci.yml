name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker-compose*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 1: Lint & SAST
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: 'Gate 1: Lint & SAST'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: ESLint (with security plugin)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Prettier format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 2: Unit Tests (≥80% coverage)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 'Gate 2: Unit Tests'
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npx jest --selectProjects unit --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary

      - name: Enforce coverage threshold (≥20%)
        run: |
          COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(c.total.lines.pct)")
          echo "Line coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 20" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 20% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 3: Integration Tests (real DB + Redis)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: 'Gate 3: Integration Tests'
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: enquiry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/enquiry_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      HMAC_SECRET: test-hmac-secret-for-ci-only-not-real
      API_KEYS: test-api-key-1,test-api-key-2
      ADMIN_API_KEY: test-admin-api-key
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: test
      SMTP_PASS: test
      CRM_WEBHOOK_URL: http://localhost:9999/crm
      WORDPRESS_GRAPHQL_URL: http://localhost:8080/graphql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npx jest --selectProjects integration --runInBand --forceExit

      - name: Run regression tests
        run: npx jest --selectProjects regression --runInBand --forceExit

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 4: Docker Build + Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-scan:
    name: 'Gate 4: Docker Build + Security Scan'
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (production target)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: enquiry-backend:${{ github.sha }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enquiry-backend:${{ github.sha }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: backend/.trivyignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 5: Deploy to VPS (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 'Gate 5: Deploy to Production'
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /opt/enquiry-platform
            git pull origin main
            # Rebuild and restart backend container (zero-downtime via PM2 inside container)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps backend
            # Wait for health check
            sleep 15
            # Run database migrations
            docker compose exec -T backend npx prisma migrate deploy
            # Verify health
            curl -sf http://localhost:3000/health/ready || exit 1
            echo "Backend deployed successfully"

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 6: Smoke Tests
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: 'Gate 6: Smoke Tests'
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run smoke tests against production
        env:
          SMOKE_BASE_URL: https://enquiry-hub-backend.karthikmuneeswaran.com
        run: npx jest --selectProjects smoke --runInBand --forceExit

      - name: Auto-rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /opt/enquiry-platform
            echo "Smoke tests failed — rolling back backend..."
            git checkout HEAD~1 -- backend/
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps backend
            sleep 15
            curl -sf http://localhost:3000/health/ready || echo "WARNING: Rollback health check failed"
            echo "Rollback complete"
