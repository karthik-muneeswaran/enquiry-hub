name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['frontend/**']
  pull_request:
    branches: [main]
    paths: ['frontend/**']

env:
  NODE_VERSION: '24'
  WORKING_DIR: frontend

jobs:
  # Gate 1: Lint & Type Check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # Gate 2: Vitest Component Tests (>= 75% coverage)
  component-tests:
    name: Vitest Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run Vitest with coverage
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile=junit-report.xml

      - name: Check coverage threshold (>= 75% lines)
        run: |
          npx vitest run --coverage --coverage.thresholds.lines=75 --coverage.thresholds.functions=75 --coverage.thresholds.branches=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: frontend/junit-report.xml
          retention-days: 14

  # Gate 3: Docker Build + Bundle Analysis + Trivy
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    needs: component-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: enquiry-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=https://enquiry-hub-backend.karthikmuneeswaran.com/api/v1
            VITE_GRAPHQL_URL=https://enquiry-hub-backend.karthikmuneeswaran.com/graphql
            VITE_ADMIN_API_KEY=build-test-key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract dist for bundle analysis
        run: |
          docker create --name fe-extract enquiry-frontend:${{ github.sha }}
          docker cp fe-extract:/usr/share/nginx/html ./dist
          docker rm fe-extract

      - name: Bundle size analysis
        run: |
          echo "=== Bundle Size Analysis ==="
          TOTAL_JS_SIZE=0
          LARGEST_CHUNK=0

          for file in dist/assets/*.js; do
            if [ -f "$file" ]; then
              GZIP_SIZE=$(gzip -c "$file" | wc -c)
              FILENAME=$(basename "$file")
              SIZE_KB=$((GZIP_SIZE / 1024))
              echo "  $FILENAME: ${SIZE_KB}KB gzipped"
              TOTAL_JS_SIZE=$((TOTAL_JS_SIZE + GZIP_SIZE))
              if [ "$GZIP_SIZE" -gt "$LARGEST_CHUNK" ]; then
                LARGEST_CHUNK=$GZIP_SIZE
              fi
            fi
          done

          TOTAL_KB=$((TOTAL_JS_SIZE / 1024))
          LARGEST_KB=$((LARGEST_CHUNK / 1024))
          echo ""
          echo "Total JS (gzipped): ${TOTAL_KB}KB"
          echo "Largest chunk (gzipped): ${LARGEST_KB}KB"

          # Budget: total JS < 500KB gzipped
          MAX_TOTAL=$((500 * 1024))
          if [ "$TOTAL_JS_SIZE" -gt "$MAX_TOTAL" ]; then
            echo "ERROR: Total JS bundle (${TOTAL_KB}KB) exceeds budget of 500KB gzipped"
            exit 1
          fi

          # Budget: largest chunk < 200KB gzipped
          MAX_CHUNK=$((200 * 1024))
          if [ "$LARGEST_CHUNK" -gt "$MAX_CHUNK" ]; then
            echo "ERROR: Largest chunk (${LARGEST_KB}KB) exceeds budget of 200KB gzipped"
            exit 1
          fi

          echo "Bundle size within budget."

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enquiry-frontend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # Gate 4: Deploy + Smoke (main branch only)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend container via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /opt/enquiry-platform
            git pull origin main
            # Rebuild and restart only the frontend container
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps frontend
            # Wait for container to be healthy
            sleep 5
            docker compose ps frontend | grep -q "Up" || exit 1
            echo "Frontend deployed successfully"

  # Gate 5: Smoke Tests
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: https://enquiry-hub.karthikmuneeswaran.com
        run: |
          echo "=== Frontend Smoke Tests ==="

          # Check 1: Frontend loads
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SMOKE_BASE_URL}/")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: Frontend root returned $HTTP_CODE (expected 200)"
            exit 1
          fi
          echo "PASS: Frontend root returns 200"

          # Check 2: Contains DOCTYPE (valid HTML)
          BODY=$(curl -s "${SMOKE_BASE_URL}/")
          if ! echo "$BODY" | grep -qi "DOCTYPE"; then
            echo "FAIL: Frontend response does not contain DOCTYPE"
            exit 1
          fi
          echo "PASS: Frontend contains DOCTYPE"

          # Check 3: SPA routes resolve
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SMOKE_BASE_URL}/properties")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: SPA route /properties returned $HTTP_CODE (expected 200)"
            exit 1
          fi
          echo "PASS: SPA route /properties resolves"

          # Check 4: Security headers present
          HEADERS=$(curl -s -I "${SMOKE_BASE_URL}/")
          if echo "$HEADERS" | grep -qi "strict-transport-security"; then
            echo "PASS: HSTS header present"
          else
            echo "WARN: HSTS header missing"
          fi

          echo ""
          echo "=== Smoke tests passed ==="

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /opt/enquiry-platform
            echo "Smoke tests failed — rolling back frontend..."
            git checkout HEAD~1 -- frontend/
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps frontend
            echo "Rollback complete"
