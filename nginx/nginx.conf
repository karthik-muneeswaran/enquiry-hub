# Nginx main configuration for Enquiry Backend Platform
# Production-ready with performance tuning and security defaults

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request ID for traceability
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time rid=$request_id';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1m;

    # Rate limiting zones (L1)
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=enquiry_post:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Rate limit response
    limit_req_status 429;
    limit_conn_status 429;

    # Upstream backend with keepalive connections
    upstream app {
        server app:3000;
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security: hide Nginx version
    server_tokens off;

    # Internal status endpoint for nginx-exporter (not exposed externally)
    server {
        listen 8080;
        server_name localhost;

        location /stub_status {
            stub_status;
            allow 172.16.0.0/12;  # Docker network range
            allow 127.0.0.1;
            deny all;
        }
    }

    # Include server block configurations
    include /etc/nginx/conf.d/*.conf;
}
