# ============================================================================
# Enquiry Hub Platform — Nginx Server Blocks
# All subdomains use a single multi-domain cert issued by Let's Encrypt.
# Cert path: /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/
# ============================================================================

# --- Frontend (React SPA) ---
server {
    listen 443 ssl;
    http2 on;
    server_name enquiry-hub.karthikmuneeswaran.com;

    ssl_certificate /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# --- Backend API + GraphQL ---
server {
    listen 443 ssl;
    http2 on;
    server_name enquiry-hub-backend.karthikmuneeswaran.com;

    ssl_certificate /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 50;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Enquiry POST — stricter rate limit
    location = /api/v1/enquiry {
        limit_req zone=enquiry_post burst=5 nodelay;
        limit_conn conn 20;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # GraphQL
    location /graphql {
        limit_req zone=api burst=10 nodelay;
        limit_conn conn 50;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health check
    location /health/ {
        rewrite ^/health/(.*)$ /v1/health/$1 break;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Admin dashboard (Bull Board)
    location /admin/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Swagger docs (backend serves at /docs, exposed publicly at /api/docs)
    location /api/docs {
        rewrite ^/api/docs(.*)$ /docs$1 break;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# --- WordPress CMS ---
server {
    listen 443 ssl;
    http2 on;
    server_name enquiry-hub-wp.karthikmuneeswaran.com;

    ssl_certificate /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    location / {
        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Grafana Monitoring ---
server {
    listen 443 ssl;
    http2 on;
    server_name enquiry-hub-grafana.karthikmuneeswaran.com;

    ssl_certificate /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enquiry-hub.karthikmuneeswaran.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTP → HTTPS Redirect (all subdomains) ---
server {
    listen 80;
    server_name enquiry-hub.karthikmuneeswaran.com
               enquiry-hub-backend.karthikmuneeswaran.com
               enquiry-hub-wp.karthikmuneeswaran.com
               enquiry-hub-grafana.karthikmuneeswaran.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
