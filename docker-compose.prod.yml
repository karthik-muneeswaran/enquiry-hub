# Production overlay — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# All services run as containers. Docker Compose manages lifecycle.
# PM2 runs INSIDE the backend container for Node.js cluster mode.
# Frontend builds itself via multi-stage Dockerfile (npm ci → tsc → vite build → nginx).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: []
    ports: []
    volumes: []
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
        reservations:
          memory: 256M
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enquiry-hub-network

  # Frontend: multi-stage build produces its own nginx container serving static files
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://enquiry-hub-backend.karthikmuneeswaran.com/api/v1}
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-https://enquiry-hub-backend.karthikmuneeswaran.com/graphql}
        VITE_ADMIN_API_KEY: ${VITE_ADMIN_API_KEY:-}
    command: []
    ports: []
    volumes: []
    env_file:
      - ./frontend/.env
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  # Main reverse proxy: SSL termination, routing to backend/frontend/grafana
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - grafana
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    ports: []
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  # --- Database & Cache (internal only) ---
  postgres:
    ports: []
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
    restart: unless-stopped

  redis:
    ports: []
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --save 300 100 --save 60 10000
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.5"
        reservations:
          memory: 64M
    restart: unless-stopped

  # --- WordPress & MySQL (internal only) ---
  wordpress:
    ports: []
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  mysql:
    ports: []
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped

  # --- Exporters (internal only) ---
  postgres-exporter:
    ports: []
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-enquiry_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-enquiry_platform}?sslmode=disable"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  redis-exporter:
    ports: []
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  mysql-exporter:
    ports: []
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpass}"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  wordpress-exporter:
    ports: []
    command:
      - "-host"
      - "http://wordpress:80"
      - "-auth.basic"
      - "false"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped

  # --- Observability (internal only, accessed via Grafana subdomain) ---
  prometheus:
    ports: []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  grafana:
    ports: []
    env_file:
      - ./backend/.env
    environment:
      - GF_SERVER_ROOT_URL=https://enquiry-hub-grafana.karthikmuneeswaran.com/
      - GF_SERVER_DOMAIN=enquiry-hub-grafana.karthikmuneeswaran.com
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  loki:
    ports: []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  tempo:
    ports: []
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    volumes:
      - ./observability/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network
