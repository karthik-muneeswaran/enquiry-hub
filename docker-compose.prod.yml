# Production docker-compose — standalone (no base file merge needed)
# Usage: docker compose -f docker-compose.prod.yml up -d
# All services run as containers. Docker Compose manages lifecycle.
# PM2 runs INSIDE the backend container for Node.js cluster mode.

services:
  # --- Application Services ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: ["pm2-runtime", "ecosystem.config.js"]
    env_file:
      - ./backend/.env
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"
        reservations:
          memory: 256M
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enquiry-hub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://enquiry-hub-backend.karthikmuneeswaran.com/api/v1}
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-https://enquiry-hub-backend.karthikmuneeswaran.com/graphql}
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      grafana:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/stub_status || curl -sf http://localhost:8080/stub_status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - enquiry-hub-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  # --- Database & Cache ---
  postgres:
    image: postgres:15-alpine
    env_file:
      - ./backend/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --save 300 100 --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.5"
        reservations:
          memory: 64M
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  # --- WordPress & MySQL ---
  wordpress:
    image: wordpress:6-php8.2-apache
    env_file:
      - ./backend/.env
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  wp-setup:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/setup.sh:/setup.sh
    entrypoint: ["/bin/sh", "/setup.sh"]
    env_file:
      - ./backend/.env
    networks:
      - enquiry-hub-network

  mysql:
    image: mysql:8.0
    env_file:
      - ./backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  # --- Metric Exporters ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-enquiry_user}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-enquiry_platform}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpass}"
    command:
      - "--mysqld.username=root"
      - "--mysqld.address=mysql:3306"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  wordpress-exporter:
    image: ghcr.io/aorfanos/wordpress-exporter/wordpress-exporter:v0.0.8
    command:
      - "-host"
      - "http://wordpress:80"
      - "-auth.basic"
      - "false"
    depends_on:
      wordpress:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  # --- Observability Stack ---
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - postgres-exporter
      - redis-exporter
      - mysql-exporter
      - wordpress-exporter
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  grafana:
    image: grafana/grafana:10.4.0
    env_file:
      - ./backend/.env
    environment:
      - GF_SERVER_ROOT_URL=https://enquiry-hub-grafana.karthikmuneeswaran.com/
      - GF_SERVER_DOMAIN=enquiry-hub-grafana.karthikmuneeswaran.com
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  loki:
    image: grafana/loki:2.9.0
    volumes:
      - ./observability/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  tempo:
    image: grafana/tempo:2.4.0
    volumes:
      - ./observability/tempo:/etc/tempo
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

  promtail:
    image: grafana/promtail:3.1.0
    volumes:
      - ./observability/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - enquiry-hub-network

volumes:
  pg_data:
  redis_data:
  mysql_data:
  wordpress_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  enquiry-hub-network:
    driver: bridge
