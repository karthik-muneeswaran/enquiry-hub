services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: npm run start:dev
    ports:
      - "3000:3000"
      - "8081:8081"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/test:/app/test
      - ./backend/prisma:/app/prisma
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.test.json:/app/tsconfig.test.json
      - ./backend/package.json:/app/package.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enquiry-hub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/test:/app/test
      - ./frontend/index.html:/app/index.html
      - ./frontend/vitest.config.ts:/app/vitest.config.ts
    depends_on:
      - backend
    networks:
      - enquiry-hub-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enquiry-hub-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enquiry-hub-network

  wordpress:
    image: wordpress:6-php8.2-apache
    ports:
      - "8080:80"
    env_file:
      - ./backend/.env
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - enquiry-hub-network

  wp-setup:
    image: wordpress:cli
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/setup.sh:/setup.sh
    entrypoint: ["/bin/sh", "/setup.sh"]
    env_file:
      - ./backend/.env
    networks:
      - enquiry-hub-network

  mysql:
    image: mysql:8.0
    env_file:
      - ./backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enquiry-hub-network

  # --- Exporters ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/enquiry_dev?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enquiry-hub-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - enquiry-hub-network

  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "rootpass"
    command:
      - "--mysqld.username=root"
      - "--mysqld.address=mysql:3306"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - enquiry-hub-network

  wordpress-exporter:
    image: ghcr.io/aorfanos/wordpress-exporter/wordpress-exporter:v0.0.8
    ports:
      - "11011:11011"
    command:
      - "-host"
      - "http://wordpress:80"
      - "-auth.basic"
      - "false"
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - enquiry-hub-network

  # --- Observability Stack ---
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - postgres-exporter
      - redis-exporter
      - mysql-exporter
      - wordpress-exporter
    networks:
      - enquiry-hub-network

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - enquiry-hub-network

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - enquiry-hub-network

  tempo:
    image: grafana/tempo:2.4.0
    ports:
      - "4318:4318"
      - "3200:3200"
    volumes:
      - ./observability/tempo:/etc/tempo
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    networks:
      - enquiry-hub-network

  promtail:
    image: grafana/promtail:3.1.0
    volumes:
      - ./observability/promtail:/etc/promtail
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - enquiry-hub-network


volumes:
  pg_data:
  redis_data:
  mysql_data:
  wordpress_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:


networks:
  enquiry-hub-network:
    driver: bridge
