# Prometheus alert rules for Enquiry Backend Platform
groups:
  - name: api_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{http_status_code=~"5.."}[5m]))
            /
            sum(rate(http_request_duration_seconds_count[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate detected"
          description: "5xx error rate is above 5% for the last 5 minutes (current: {{ $value | humanizePercentage }})"
          runbook: "docs/RUNBOOK.md#high-error-rate"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "p95 latency is above 2 seconds for the last 5 minutes (current: {{ $value }}s)"
          runbook: "docs/RUNBOOK.md#high-latency"

  - name: queue_alerts
    rules:
      - alert: DLQGrowing
        expr: queue_depth{state="failed"} > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue is growing"
          description: "DLQ depth for queue {{ $labels.queue_name }} is {{ $value }} (threshold: 10)"
          runbook: "docs/RUNBOOK.md#dlq-growing"

  - name: infrastructure_alerts
    rules:
      - alert: DBConnectionExhaustion
        expr: (db_pool_active_connections / 10) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool nearing exhaustion"
          description: "Active DB connections are above 80% of pool max (current: {{ $value | humanizePercentage }})"
          runbook: "docs/RUNBOOK.md#db-connection-exhaustion"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is above 80% of maxmemory (current: {{ $value | humanizePercentage }})"
          runbook: "docs/RUNBOOK.md#redis-memory-high"

      - alert: EventLoopLag
        expr: event_loop_lag_seconds > 0.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node.js event loop lag is critically high"
          description: "Event loop lag is {{ $value }}s (threshold: 500ms). Load shedding should be active."
          runbook: "docs/RUNBOOK.md#event-loop-lag"

      - alert: ContainerRestart
        expr: increase(container_restart_count[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container restarted"
          description: "Container {{ $labels.container_name }} has restarted in the last 5 minutes"
          runbook: "docs/RUNBOOK.md#container-restart"

      - alert: DiskSpaceHigh
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space usage is high"
          description: "Filesystem {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full"
          runbook: "docs/RUNBOOK.md#disk-space-high"
