server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep containers from the app-network
      - source_labels: ['__meta_docker_container_name']
        regex: '.*'
        action: keep
      # Use container name as the label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: container
      - source_labels: ['__meta_docker_container_name']
        regex: '/enquiry-hub-(.+)-1'
        target_label: service
      # Add compose service label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
    pipeline_stages:
      - docker: {}
      # Try to parse JSON logs from the NestJS app
      - match:
          selector: '{compose_service="backend"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  context: context
            - labels:
                level:
                context:
